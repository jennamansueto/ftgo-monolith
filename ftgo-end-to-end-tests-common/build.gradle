apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
    }
}

dependencies {
    api project(":ftgo-consumer-service-api")
    api project(":ftgo-restaurant-service-api")
    api project(":ftgo-order-service-api")
    api project(":ftgo-courier-service-api")
    implementation "io.eventuate.util:eventuate-util-test:$eventuateUtilVersion"


    implementation "org.springframework.boot:spring-boot-starter-test:$springBootVersion"
    implementation("io.rest-assured:rest-assured:$restAssuredVersion") {
        // rest-assured 5.x pulls Apache Groovy 4.x which conflicts with
        // Spring Boot 2.7's managed Groovy 3.x on the groovy-xml capability
        exclude group: 'org.apache.groovy'
    }
    implementation "com.jayway.jsonpath:json-path:2.3.0"

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}
