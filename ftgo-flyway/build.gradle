plugins {
    id "org.flywaydb.flyway" version "8.5.13"
}

dependencies {
    implementation 'com.mysql:mysql-connector-j:8.0.33'
}

flyway {
    url = "jdbc:mysql://${System.getenv('DOCKER_HOST_IP') ?: 'localhost'}/ftgo?useSSL=false"
    user = 'root'
    password = 'rootpassword'
    schemas = ['ftgo']
}
