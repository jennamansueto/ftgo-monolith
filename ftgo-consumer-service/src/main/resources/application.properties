spring.application.name=ftgo-consumer-service

server.port=8082

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver.class.name=com.mysql.jdbc.Driver

# Flyway is disabled by default; ftgo-flyway is the canonical migrator for the
# shared `ftgo` database. Set `spring.flyway.enabled=true` to migrate the
# bundled consumer-table schema (V1__create_consumers_table.sql) when running
# the consumer service against an empty/dedicated database.
spring.flyway.enabled=false
