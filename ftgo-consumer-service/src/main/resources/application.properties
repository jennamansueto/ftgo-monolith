spring.application.name=ftgo-consumer-service

server.port=8082

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo_consumer?useSSL=false
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver.class.name=com.mysql.jdbc.Driver

# Run Flyway migrations on startup against the dedicated consumer database
spring.flyway.enabled=true

# Expose the Actuator health endpoint for liveness/readiness checks
management.endpoints.web.exposure.include=health,info
