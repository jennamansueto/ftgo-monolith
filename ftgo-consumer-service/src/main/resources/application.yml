server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${DOCKER_HOST_IP:localhost}:3306/ftgo_consumer?useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

# Configure SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
# via environment variables or a separate application-local.yml profile.
