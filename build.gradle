buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
        classpath "io.spring.gradle:dependency-management-plugin:$springDependencyManagementPluginVersion"
    }

    apply plugin: WaitForMySqlPlugin
}

plugins {
    id "com.github.ben-manes.versions" version "0.47.0"
}


subprojects {

    apply plugin: "java"
    apply plugin: "java-library"
    apply plugin: "io.spring.dependency-management"

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
        dependencies {
            dependencySet(group: 'io.rest-assured', version: "${restAssuredVersion}") {
                entry 'rest-assured'
                entry 'json-path'
                entry 'xml-path'
                entry 'spring-mock-mvc'
                entry 'spring-commons'
                entry 'rest-assured-common'
            }
        }
    }

    sourceCompatibility = '17'
    targetCompatibility = '17'

    group = "net.chrisrichardson.ftgo"

    repositories {
        mavenCentral()

        // Commenting out problematic repositories that require authentication or are no longer available
        // eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }

        // maven {
        //     url 'https://repo.spring.io/libs-milestone'
        // }

        maven {
            url "${project.rootDir}/build/repo"
        }

    }

    dependencies {
        testImplementation "junit:junit:4.13.2"
        testImplementation "org.codehaus.groovy:groovy:3.0.19"
        testImplementation "org.codehaus.groovy:groovy-xml:3.0.19"
        testImplementation "org.codehaus.groovy:groovy-json:3.0.19"
    }

}
