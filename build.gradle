buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
        classpath "io.spring.gradle:dependency-management-plugin:$springDependencyManagementPluginVersion"
    }

    apply plugin: WaitForMySqlPlugin
}

plugins {
    id "com.github.ben-manes.versions" version "0.20.0"
}


subprojects {

    apply plugin: "java"
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    configurations.all {
        resolutionStrategy.capabilitiesResolution.all { details ->
            def dominated = details.candidates.find { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && it.id.group == 'org.codehaus.groovy' }
            def preferred = details.candidates.find { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && it.id.group == 'org.apache.groovy' }
            if (dominated && preferred) {
                details.select(preferred)
            }
        }
    }

    group = "net.chrisrichardson.ftgo"

    repositories {
        mavenCentral()

        // Commenting out problematic repositories that require authentication or are no longer available
        // eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }

        // maven {
        //     url 'https://repo.spring.io/libs-milestone'
        // }

        maven {
            url "${project.rootDir}/build/repo"
        }

    }

}
