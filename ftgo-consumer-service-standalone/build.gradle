apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencies {
    compile project(":ftgo-consumer-service-api")
    compile project(":ftgo-common")

    compile "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"
    compile "org.springframework.boot:spring-boot-starter-web:$springBootVersion"
    compile "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"

    compile 'mysql:mysql-connector-java:5.1.39'

    runtime "javax.xml.bind:jaxb-api:2.2.11"
    runtime "com.sun.xml.bind:jaxb-core:2.2.11"
    runtime "com.sun.xml.bind:jaxb-impl:2.2.11"
    runtime "javax.activation:activation:1.1.1"

    testCompile "org.springframework.boot:spring-boot-starter-test:$springBootVersion"
    testCompile 'org.mockito:mockito-inline:2.23.4'
    testCompile 'net.bytebuddy:byte-buddy:1.9.7'
    testCompile 'net.bytebuddy:byte-buddy-agent:1.9.7'
    testCompile 'com.h2database:h2:1.4.197'
}

test {
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
}
