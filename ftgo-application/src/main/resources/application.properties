spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver.class.name=com.mysql.cj.jdbc.Driver

# Springfox 2.x requires ant-path-matcher (Spring Boot 2.6+ defaults to path-pattern-parser)
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
