dependencies {
    // TODO eliminate this - problem is value objects like Money need to be embeddable.
    // TODO https://en.wikibooks.org/wiki/Java_Persistence/Embeddables#Example_of_an_Embeddable_object_XML

    api "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"

    // Jackson — let Spring Boot BOM manage versions, or pin to 2.14.x compatible with Spring Boot 2.7
    api "com.fasterxml.jackson.core:jackson-core"
    api "com.fasterxml.jackson.core:jackson-databind"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    // Replace commons-lang 2.x with commons-lang3
    api 'org.apache.commons:commons-lang3:3.14.0'

    // Update MySQL connector — new artifact coordinates for 8.x
    implementation 'com.mysql:mysql-connector-j:8.0.33'

    testImplementation "org.springframework.boot:spring-boot-starter-test:$springBootVersion"

    // JAXB — removed from JDK 11+. Use Jakarta JAXB for Java 17.
    runtimeOnly "jakarta.xml.bind:jakarta.xml.bind-api:2.3.3"
    runtimeOnly "org.glassfish.jaxb:jaxb-runtime:2.3.9"
    // javax.activation replacement
    runtimeOnly "jakarta.activation:jakarta.activation-api:1.2.2"
}
