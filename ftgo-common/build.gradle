dependencies {
    api "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"

    // Jackson — pinned to Boot 2.7.x-compatible versions
    api "com.fasterxml.jackson.core:jackson-core:2.13.5"
    api "com.fasterxml.jackson.core:jackson-databind:2.13.5"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.5"

    // Replace commons-lang 2.x with commons-lang3
    api "org.apache.commons:commons-lang3:3.14.0"

    // MySQL connector — new coordinates for 8.x
    implementation "com.mysql:mysql-connector-j:8.0.33"

    testImplementation "org.springframework.boot:spring-boot-starter-test:$springBootVersion"
    testImplementation "junit:junit:4.13.2"

    // JAXB — removed from JDK since Java 11, needed as explicit deps
    runtimeOnly "javax.xml.bind:jaxb-api:2.3.1"
    runtimeOnly "org.glassfish.jaxb:jaxb-runtime:2.3.9"
    runtimeOnly "javax.activation:javax.activation-api:1.2.0"
}
