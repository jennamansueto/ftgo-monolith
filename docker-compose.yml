version: '3'
services:
  mysql:
    build: ./mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_USER=mysqluser
      - MYSQL_PASSWORD=mysqlpw
  consumer-service-mysql:
    image: mysql:5.7
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_USER=${MYSQL_USER:-mysqluser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mysqlpw}
      - MYSQL_DATABASE=ftgo_consumer_service
  ftgo-consumer-service:
    build: ./ftgo-consumer-service-microservice
    ports:
      - "8090:8090"
    depends_on:
      - consumer-service-mysql
    environment:
      CONSUMER_SERVICE_DB_HOST: consumer-service-mysql
      CONSUMER_SERVICE_DB_PORT: "3306"
      CONSUMER_SERVICE_DB_USERNAME: ${MYSQL_USER:-mysqluser}
      CONSUMER_SERVICE_DB_PASSWORD: ${MYSQL_PASSWORD:-mysqlpw}
      JAVA_OPTS: -Xmx192m
  ftgo-application:
    build: ./ftgo-application
    ports:
      - "8081:8080"
    depends_on:
      - mysql
      - ftgo-consumer-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/ftgo
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: mysqlpw
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.jdbc.Driver
      CONSUMER_SERVICE_URL: http://ftgo-consumer-service:8090
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181
      JAVA_OPTS: -Xmx192m
      SPRING_SLEUTH_ENABLED: "true"
      SPRING_SLEUTH_SAMPLER_PROBABILITY: 1
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411/
