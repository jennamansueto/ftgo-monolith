spring.application.name=ftgo-restaurant-service

server.port=8080

spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}:3306/ftgo
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mysqluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysqlpw}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
