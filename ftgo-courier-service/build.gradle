dependencies {
    implementation project(":ftgo-courier-service-api")

    implementation project(":common-swagger")
    implementation project(":ftgo-domain")

    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'javax.el:javax.el-api:2.2.5'

    testImplementation "org.springframework.boot:spring-boot-starter-test"

    testImplementation("io.rest-assured:rest-assured:$restAssuredVersion") {
        exclude group: 'org.apache.groovy'
    }
    testImplementation("io.rest-assured:spring-mock-mvc:$restAssuredVersion") {
        exclude group: 'org.apache.groovy'
    }
    testImplementation("io.rest-assured:json-path:$restAssuredVersion") {
        exclude group: 'org.apache.groovy'
    }
    testImplementation 'org.apache.groovy:groovy:4.0.21'
    testImplementation 'org.apache.groovy:groovy-xml:4.0.21'
    testImplementation 'org.apache.groovy:groovy-json:4.0.21'

    testImplementation project(":ftgo-test-util")
}
